# プロジェクトのルートディレクトリ
root = "."

# 一時ファイルなどを格納するディレクトリ（ビルドログなど）
tmp_dir = "tmp"

[build]
# ビルドコマンド（ここで明示的にエントリーポイントを指定）
cmd = "go build -o ./build/main ./cmd/main.go"

# ビルド後のバイナリ実行ファイルのパス
bin = "./build/main"

# 除外するディレクトリ（監視・ビルド対象外）
exclude_dir = ["tmp", "vendor", "testdata"]

# 監視対象ファイルの拡張子（Goのみを対象に）
include_ext = ["go"]

# 除外するファイルパターン（例: *_test.go を除外）
exclude_regex = ["_test.go"]

# ビルドエラーのログ出力先ファイル
log = "build-errors.log"

# 変更検知からビルド実行までの遅延（ミリ秒）
delay = 1000

[log]
# メインプロセスのログのみ表示するか（falseで全て出力）
main_only = false

# ログ出力を無効化（falseでログ表示）
silent = false

# ログに時刻を表示するか
time = true

[screen]
# 再ビルド時にコンソールをクリアするか
clear_on_rebuild = true

# スクロール位置を維持するか（trueでビルドログの末尾を維持）
keep_scroll = true
